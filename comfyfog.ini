; comfyfog: volumetric light, sun shadows, sun rays and lamp glow for the 1.12 client.
;
; Lives in the client root next to d3d9.dll. F11 reloads this file (every value is live);
; Ctrl+F11 toggles the sun rays, Alt+F11 the volumetric light.
; F12 logs one frame of fog state and vertex shader constants to comfyfog.log, and over the next 60
; frames the lights of lamps, lanterns and torches (lines starting "lamps:"). Alt+F12 runs the benchmark
; (see [bench]). (Setting the time of day is comfytime, a separate DLL.)
;
; The ComfyAtmosphere addon puts many of these settings in Video > Atmosphere, and /atmos options opens
; them in a window: [general] enabled (the box at the top, every effect at once), and controls for
; [volume], [sunshadows], [shadow], [lamps], [rays], [night] and [sky]. The values here are the defaults
; of those controls. Its Debug View slider shows one stage of an effect (the
; list is in its tooltip); at 0 the debug values in this file apply. /atmos in the game's chat sets any
; other value here (see the README).
; A control you move wins over this file, also after F11. The Defaults button in that page puts the
; values here back.

; The fog: thick at the ground and thinning upward. It darkens what lies behind it and is lit by the sun
; and by the sky. Needs [depth] enabled. With [volume] enabled it is drawn with the volumetric light, and
; shows shafts where things shade the sun. With [volume] enabled = 0 it draws alone, with no shadow map:
; the sun lights all of it, as at Volumetric Light Strength 25. The game's own fog stays, as the far wall.
[fog]
enabled      = 1
density      = 0.0025  ; fog per yard at the ground. 0.0025 lets through 60% of what is 200 yards away
height       = 25      ; yards: the fog thins by 2.7 times every this many yards up
groundRadius = 150     ; yards around you the ground under the fog is averaged over (the map files)
reach        = 200     ; yards: how far a line of sight gathers fog. It fades out over the last 40%; past it
                       ; the game's own fog is the far wall
skyDistance  = 75      ; yards: the same for a line of sight to the sky (0 = the sky gets no fog)
brightness   = 1.2     ; the sky's light on the fog: the game's fog colour times this
sunLight     = 4.0     ; the sun's light on the fog, against the air's. Volumetric Light Strength sets both
patchiness   = 0.5     ; 0 = an even fog; 1 = thick patches with clear air between
scale        = 60      ; yards: how big a patch is
flatten      = 2       ; patches are this many times wider than tall
windDeg      = 45      ; the way the wind blows the patches: 0 north, 90 east
windSpeed    = 1.5     ; yards a second
follow       = 0.5     ; 0 = the fog lies on the ground smoothed over smoothRadius, so it fills valleys; 1 =
                       ; on the ground itself, as thick on a hilltop as in the valley below
smoothRadius = 100     ; yards
lowGround    = 1.5     ; the fog this much thicker again where the ground lies lowDepth yards below the
lowDepth     = 25      ; smoothed ground around it: valleys and hollows. Ground higher than this above a point
                       ; (a mountain, a city wall) counts as this high in its smoothing
water        = 2.1     ; this much thicker again over rivers, lakes and the sea. Over low water the larger of
                       ; the two counts, not both
morning      = 1.0     ; this much thicker at dawn (6:00), and half of it at dusk (20:00)
lampMist     = 0.5     ; a lamp's glow in the air this much brighter for each time the ground's fog thickness
                       ; around it. The fog between you and a lamp dims it either way
debug        = 0       ; 1 = the transmittance (white = clear); 2 = the sky's light on the fog alone

; Where the sun is, for the shadow map and the volumetric light. By default it is the sun the client
; draws in the sky, so the light follows the time of day.
[sun]
fixed        = 0       ; 1 = a fixed sun at azimuth/elevation below, whatever time the game says it is,
                       ; for testing in the same light every time
azimuth      = 45      ; degrees; the defaults are the afternoon sun the sky showed while this was tuned
elevation    = 50
glide        = 3       ; seconds at least that the sun takes to follow a step of the sky (Sun Smoothing). The
                       ; sky steps once a game minute, and each step is followed at a steady speed over the
                       ; time since the last one, so the shadows move on all the time. 0 = at once

; Where the client keeps the camera and the player (the same addresses comfygrass uses). Shadows and
; volumetric light read them. Another WoW.exe build moves them.
[client]
camAddr      = 0x00C7CF20
objMgrAddr   = 0x00B41414
playerPosOff = 0x9B8
clockAddr    = 0x00CE9B64 ; the game's time of day, for [night] (the address comfytime writes)
mapNameAddr  = 0x00C961A0 ; the current map's folder name, for [shadow] mapTerrain

; A depth buffer the shaders can read (the INTZ format) swapped in for the client's. The volumetric light
; reads it. Off by default.
[depth]
enabled      = 1
seeThrough   = 1       ; 1 = a see-through model (a stealthed unit) writes no depth, so the shadows and the light
                       ; do not outline it; 0 = as the game draws it
seeThroughNear = 4     ; yards: not while the camera is this near your character. Zoomed in, the game fades
                       ; your character the same way, and its face showed through the back of its head
seeThroughNearMounted = 15 ; yards: the same while you ride a mount. The game fades the larger model
                       ; from farther off, and the far side of the horse showed through
waterDepth   = 1       ; 1 = the water writes depth, so the sun shadows and the light see its surface; 0 = as
                       ; the game draws it (they see what lies under the water)

; A shadow map from the sun: the frame's solid world (terrain, buildings, trees) drawn a second time as the
; sun sees it. The volumetric light reads it. Off by default.
[shadow]
enabled      = 1
size         = 4096    ; texels per side, 256..4096. 4096 gives sharper sun shadows and costs about twice the
                       ; GPU time of 2048. The Shadow Resolution control sets 1024, 2048 or 4096
range        = 250     ; yards covered either side of you
nearRange    = 32      ; a finer map this many yards either side of you, for the sun shadows. 0 = none.
                       ; The Near Shadow Distance control sets it (16 to 128)
midRange     = 100     ; a middle map this many yards either side, for the sun shadows past the near map: the
                       ; shade a wall's merlons or eaves cast close behind them. 0 = none (64 MB less)
depth        = 700     ; yards toward and away from the sun (far enough for a ridge to block it)
horizonDepth = 1500    ; with mapTerrain: yards toward the sun the ground still casts, so a far ridge blocks
                       ; the light. Buildings and models stay within depth
nearMargin   = 16      ; yards past the near map a model's reference point may be and still be drawn into it
terrainLeaves = 1      ; 1 = hills and mountains cast part shade ([sunshadows] terrainShade), in a map of their
                       ; own; 0 = full shade, in the solid maps
mapTerrain   = 1       ; 1 = the ground is read from the map files at full detail; 0 = only what the game draws
terrainLow   = 1       ; 1 = that ground casts from a copy never above the game's coarse far mesh, so the far
                       ; ground does not shade itself in blocks; 0 = from the full detail
leafAlpha    = 224     ; the leaves from the map files cast where their texture's alpha is at least this (1..255)
leaves       = 1       ; 1 = leaves and bushes (alpha-tested) in shadow maps of their own, so they can let
                       ; part of the sun through ([sunshadows] leafShade)
minTriangles = 200     ; models with fewer triangles stay out of the far map past 60 yards (0 = all in)
farEvery     = 2       ; of those rebuilds, redraw the far map on every Nth (the near map on each), 1..8
mapEvery     = 1       ; rebuild the shadow map every N frames, 1..8 (3 = a third of the replay cost).
                       ; The Shadow Redraw control sets it
horizon      = 1       ; 1 = distant terrain shades you too
snap         = 1       ; 1 = hold the far map on whole texels of its own grid: shadow edges do not crawl as
                       ; you walk. 0 = it slides with you
nearSnap     = 1       ; 1 = hold the near map on whole texels of its own grid: shadow edges near you do not
                       ; hop as you walk. 0 = it slides with you
sunStep      = 0.05    ; degrees: the maps' sun is held and moved on in steps of this, so the shadow edges do
                       ; not crawl while you stand still. With a low sun each step moves long shadows a few
                       ; pixels at once. 0 = it moves every frame
keepMargin   = 100     ; yards past range that a tree or building out of view keeps casting shade, from you
                       ; across the ground: while it can still cast into the map
cacheTime    = 0       ; seconds at most that something out of view keeps casting shade; 0 = no limit
staleTime    = 8       ; with mapTerrain: seconds at most that something the game stopped drawing keeps its
                       ; shade (characters, creatures, objects); 0 = no limit
evictDistance = 20     ; yards: something in view this near that the game stopped drawing is gone
stillRadius  = 0.3     ; yards a tree may seem to move and keep its place in the map

; Volumetric light: the fog glowing where the sun reaches it and dark where leaves and walls shade it.
; The lamp-in-a-foggy-room look, fixed in the world as you move the camera. Needs [depth] and [shadow]
; enabled. Alt+F11 toggles it.
[volume]
enabled      = 1
strength     = 25      ; the dial, 0..100
maxIntensity = 3.0     ; brightness at 100
density      = 0.016   ; how much the air scatters light, per yard. Higher = thicker, brighter shafts
smooth       = 0.85    ; 0..0.95: how much of the last frame's glow is kept. It moves with the camera, so a
                       ; turn does not smear. 0 also stops the noise pattern from changing each frame
steps        = 64      ; samples along each line of sight (more holds up over a long maxDistance)
maxDistance  = 190     ; yards along each line of sight (keep at or under [shadow] range)
anisotropy   = 0.070   ; 0 = glows the same from every side; toward 1 = mostly when looking toward the sun
bias         = 0.5     ; yards of slack in the shadow test, against speckle on sunlit surfaces
leafShade    = 1       ; how much of the sun the leaves stop in the air, 0..1. 1 = the light comes through the
                       ; gaps between the leaves only, in shafts. The ground's own is [sunshadows] leafShade
color        = 0xFFE6BE ; RGB of the light (default: warm late-morning)
downscale    = 2       ; work at 1/N resolution per axis (2 = half)
blur         = 1       ; smooth the noise the step jitter leaves
quality      = 3       ; 1 low, 2 medium, 3 high. High uses the values above; medium and low replace
                       ; steps and downscale with cheaper ones: medium 48, 2; low 32, 3
debug        = 0       ; 1 = show the glow alone, white, to see its shape. For finding faults, one stage
                       ; of the march each: 2 = white if it runs at all, 3 = the depth it reads,
                       ; 4 = distance marched (white = maxDistance), 5 = share of each ray in sunlight
occlusion    = 1       ; 1 = the light fades when the sun's disc is behind terrain on screen, as for the
                       ; rays ([rays] occlusionRadius and occlusionFull). The shadow map reaches only
                       ; [shadow] depth, so without this a sun setting behind the far horizon lights the fog

; Sun shadows: trees, buildings and characters shade the ground and walls. They come from the volumetric
; light's shadow map, so they draw only while [volume] draws. They follow the sun's height and [night]
; strength. Within [shadow] nearRange yards of you they use a finer map (0.016 yards a texel at size 4096),
; further out the far one (0.12). F12 logs the draw (lines starting "sunshadows:").
[sunshadows]
enabled      = 1
world        = 1       ; terrain, buildings, trees and doodads cast. 0 = only players and creatures do,
                       ; and the ground keeps the game's own baked shadows
units        = 1       ; players and creatures cast. 0 = the game's round shadow under them instead
lock         = 0       ; 1 = shadows at a set tilt all day, as the game's own baked shadows are; 0 = follow the sun
lockTilt     = 15      ; with lock: degrees from straight down (0 = the sun overhead, short shadows)
lodBias      = 2       ; yards of slack in the shadow test for every 100 yards past lodStart: the game draws
                       ; distant ground coarser, and without it soft blobs lie on far slopes. 0 = none
lodStart     = 80      ; yards from the camera where lodBias starts
indoor       = 0       ; 0..1, how much of the sun shadows is kept inside a building (the game lights rooms itself)
shadeColor   = 0x7C94C8 ; RGB shade leans toward: the sky's cool light (its hue only: brightness is kept)
shadeTint    = 0.65    ; 0..1, how much. 0 = shade only darkens, in grey
sunColor     = 0xFFE4C0 ; RGB sunlit ground leans toward: warm
sunTint      = 0.95    ; 0..1, how much
strength     = 20      ; the dial, 0..100: how much of the light a shaded surface loses
night        = 100     ; 0..100: the shadows at night, as % of strength. [night] strength does not apply
riseFrom     = 12      ; degrees: with the sun or moon lower than this, the shadows' light climbs back up as
                       ; it sinks. A low light pushes shadows away from what casts them. 0 = never
riseTo       = 85      ; degrees: the shadows' light with the sun or moon at the horizon or under it
unitStrength = 45      ; 0..100: players' and creatures' shadows this much darker again, also inside the
                       ; shade of a building. 0 = as dark as the world's
unitGap      = 0.5     ; yards along the sun over which that extra fades in from the unit, on its own body
                       ; only: less on its back and arms, and the ground keeps it up to the feet
unitDrop     = 4       ; yards under the unit past which that extra fades out, over 3 more: a shadow on the
                       ; ground lies within the unit's height, the water under a bridge lower
bodyShade    = 30      ; 0..100: the shade on a player's or creature's own body, as a share. 100 = all of it,
                       ; 0 = none. The Character Backside Shadow control sets it
bias         = 3       ; texels of slack in the depth test at the least; more as the sun gets lower, so flat
                       ; ground does not shade itself in stripes. In texels of each map. Higher = no bands where
                       ; a surface shades itself, but shadows start further from what casts them
minGap       = 0       ; yards: a blocker nearer the surface than this, along the sun, does not shade it.
                       ; Against a model or a tree shading itself; shadows then start this far from
                       ; where something touches the ground
sunOffset    = 0.06    ; yards each point is moved toward the sun before the test, against the same
normalBias   = 4       ; texels of the finest map each point is moved along its facing, rebuilt from the
                       ; depth, where the sun grazes the surface or is behind it. 0 = none, and walls the sun
                       ; grazes shade themselves in stripes; 2 left speckles where it grazes a round tower. Players and creatures take none of it (the
                       ; facing is per triangle on a model); with units = 0 they take all of it
slope        = 0       ; 0..1, how much of the surface's slope (from the same facing) sets each tap's depth.
                       ; Try 1 if sloped ground shows stripes at a high softness
softness     = 1.0     ; how far apart the taps of the soft edge are, in map texels. 0 = sharp edges
baked        = 0       ; 0..1, how much of the terrain's own baked shadow is kept while these draw. It
                       ; points one way at every hour; it is back in full as these fade at dusk
leafShade    = 0.6     ; 0..1, the share of the sun that leaves stop (the Tree Shadow Strength control). A
                       ; tree's shade shows inside a hill's, darker. Solid things under them still shade
terrainShade = 0.6     ; 0..1, the share of the sun that hills and mountains stop, with [shadow] terrainLeaves
terrainBias  = 1.5     ; yards: the least slack in the hills' depth test. Less, and the ground shades itself in
                       ; faint bands; more, and a small hill's shade starts further from it
hillCarry    = 30      ; yards: inside a hill's shade, a tree's or a wall's shade is kept in full this far from
                       ; what it falls on, and gone at twice as far. 0 = no limit
water        = 0.4     ; 0..1: the shade on the water's own surface, as a share of the ground's, soft edged
                       ; (Shadow on Water). The bed under the water keeps its own
sunlight     = 0.35    ; 0..0.5, what the sun reaches is brightened by up to this share (0.2 = 20%)
debug        = 0       ; 1 = show the shade alone (white = lit); 2 = the leaves' shade alone

; Lamps, lanterns and torches: the fog glows around them, and lampposts light the ground and walls near
; them as the game's torches do. The lights are the game's own (torches and braziers, also those NPCs
; carry) and lampposts, found by their glow sprite. It uses the volumetric light's depth and camera, so it
; draws only while [volume] draws, but it does not follow the sun and draws at night too.
; F12 logs the lights it draws (lines starting "lampglow:").
[lamps]
enabled      = 1
strength     = 26      ; the dial, 0..100
maxIntensity = 10.0    ; the glow in the air: brightness at 100
surface      = 7       ; a lamppost's light on the ground and walls near it, like a torch's: brightness
                       ; at 100. 0 = none. The game's own torches light these already and are left alone
torchLight   = 0.23    ; fires (torches, braziers, campfires, and the torches NPCs carry): their glow and light,
                       ; 0..2. The game lights models near them already, so at 1 those are lit twice
lanternLight = 0.69    ; lamps (lampposts, lanterns, candles, chandeliers): their glow and light, 0..2
indoors      = 0.29    ; every lamp while you are inside a building, 0..1. A room holds many lights close
                       ; together, and at 1 the air between them washes out
density      = 0.03    ; how much the air scatters a lamp's light, per yard. Higher = a wider, brighter glow
day          = 51      ; % of the night strength by day, by [night] dusk, dawn and fade
maxDistance  = 120     ; yards: a light further away adds nothing. The glow also fades over the far half
                       ; of the fog
maxLights    = 32      ; the most lights one part of the screen draws, nearest first, 1..32
keep         = 2       ; seconds a light on screen may go unseen before it fades out. A light off screen
                       ; is kept: the game names a lamppost only while it is on screen
softness     = 0.4     ; yards: the radius of a light's bright core
through      = 1.5     ; yards the glow runs on past the first surface in the way. The game's light sits
                       ; inside the torch head or the bowl, which hides it from some angles at 0. A lamp
                       ; this near behind a wall glows faintly through it
sprites      = 1       ; 1 = lampposts glow too, found by their warm glow sprite
files        = 1       ; 1 = the candles, torches and fireplaces in buildings glow too, read from the map files
fogReach     = 2.6     ; how far into the fog lamps still glow: 1 = they fade over the far half of the fog, as the
                       ; game fades its own lamp sprites; 2 = twice as far
spriteReach  = 16      ; yards a lamppost's light reaches (a torch's is 17; the game's lights carry their own)
spriteGain   = 1.5     ; a lamppost's brightness; 1.5 is about a torch's
debug        = 0       ; 1 = show the glow alone, over black; 2 = the distance it reads (white = 50 yd);
                       ; 3 = the light on surfaces alone

; Sun rays: bright sky near the sun streaks outward, through gaps in the trees and clouds. Drawn after the
; world and before the UI, so the UI gets none. Cheap, and needs neither [depth] nor [shadow]. The rays
; follow the sun in [sun]. Ctrl+F11 toggles them.
[rays]
enabled      = 1

; The dial. 0 = no rays, 100 = maxExposure, on a curve: exposure = maxExposure x (strength / 100)^2.
; Most of the change is at the top of the dial. 35 gives 0.7.
strength     = 40
maxExposure  = 5.7

relThreshold = 0.20    ; 0..1, a pixel casts rays if it is this bright relative to the brightest thing on
                       ; screen, so sky gaps in a dim forest still cast. Lower = more things glow
threshold    = 0.20    ; 0..1, absolute minimum brightness, so dark scenes do not streak from dim lights
radius       = 0.8     ; how far from the sun, in screen heights, pixels still cast rays.
                       ; Keep this tight: wider lets bright clouds elsewhere in the sky cast rays too
falloff      = 2.0     ; how sharply that fades with distance: 1 = straight line, 2+ = hugs the sun
length       = 0.85    ; 0..1, ray length as a fraction of the way from each pixel toward the sun
maxLength    = 0.6     ; ...but never longer than this many screen heights (matters when the sun is far off screen)
maxAngle     = 60      ; degrees between where you look and the sun at which rays are gone. Over 90, rays
                       ; stream in from the top of the screen with the sun out of view, fed by whatever sky is
                       ; there, so the view brightened and darkened as the camera tilted. The shafts from a sun
                       ; out of view come from the volumetric light instead
viewFalloff  = 1.0     ; how quickly rays weaken as you turn from the sun toward maxAngle; higher = faster
parallel     = 0.0     ; 0 = rays fan out from the sun (how real sunbeams look in perspective);
                       ; 1 = parallel streaks all falling the same way: a stylised look, not steadier
adaptTime    = 0.5     ; seconds for "what counts as bright" to follow the scene; 0 = instant (flickers)
coverTime    = 0.15    ; seconds the rays and the volumetric light take to fade when something covers the sun,
                       ; and to come back when it is clear
decay        = 0.96    ; 0.5..1, falloff along each ray; lower = shorter, softer shafts
soften       = 1       ; pixels (of the mask, which is 1/downscale of the screen) the mask is blurred before
                       ; the rays are drawn, so small gaps between leaves do not make rays jump. 0 = none
smooth       = 0       ; 0..0.95, how much of the last frame is kept, moved with the sun. Leaf edges
                       ; smaller than a pixel flicker as the camera moves; this keeps the rays steady. 0 = none
color        = 0xFFE6BE ; RGB of the light (default: warm late-morning)
passes       = 3       ; 1..3 blur passes; fewer is cheaper but shows banding
downscale    = 2       ; work at 1/N resolution per axis
debugView    = 0       ; 1 = show only the bright-pixel mask, 2 = show only the rays, 3 = show the sky
                       ; kept before the clouds (for skyOnly). For tuning
placement    = 0       ; 0 = between world and UI; 1 = over everything, UI included (fallback)
mask         = 1       ; 1 = a pixel casts where it shows sky, from the depth buffer: steady as the camera moves.
                       ; 0 = by brightness, relative to the brightest thing on screen (relThreshold)
skyOnly      = 1       ; 1 = only the sky casts, not the clouds: lit clouds near the sun glow otherwise.
                       ; The kept sky has no glow, so it is dimmer; relThreshold 0.20 suits it. 0 = all
secondMoon   = 1       ; at night the volumetric light follows the larger of the two moons. 1 = the other
                       ; moon casts rays too; 0 = rays from the larger moon only
occlusion    = 1       ; 1 = rays fade when the sun itself is covered, by a mountain or a wall. Tested by
                       ; depth when [depth] is on, else by brightness (needs skyOnly; heavy fog defeats
                       ; it). 0 = the sky above a ridge casts rays over it with the sun behind it
occlusionRadius = 0.08 ; screen heights around the sun that are tested
occlusionFull = 0.35   ; share of that sky in view that gives full rays; less fades them. Lower keeps
                       ; more rays through a canopy

; Sun rays and volumetric light at night. At night they follow the moons, which are high in the sky, so
; without this the rays and the light at night are as strong as by day. Night is
; told from the game clock ([client] clockAddr), so it follows the time comfytime sets. F12 logs the game
; time and the value in use.
[night]
strength     = 25      ; the dial, 0..100: the rays and the light at night, as % of their day strength.
                       ; 100 = as by day, 0 = none at night
dusk         = 20      ; hour the change to night starts (fractions allowed: 20.5 = 20:30)
dawn         = 5       ; hour the change to day starts
fade         = 1.5     ; hours each change takes: full night from dusk + fade to dawn, full day from
                       ; dawn + fade to dusk
darkness     = 0.20    ; 0..0.9: how much darker the world is at full night (Night Darkness). Lamps
                       ; still light the ground near them. Needs Volumetric Light on
tint         = 0.65    ; 0..1: how far the night leans toward moonColor (Moonlight Colour)
moonColor    = 0x9CB8FF ; RGB of the moonlight (its hue only: brightness is kept)
sky          = 0.5     ; 0..1: the share of the darkness the sky gets. 0 leaves the sky, moons and stars
rain         = 0.3     ; 0..0.9: how much darker again while it rains at night, the sky too (Rain Darkness)
indoors      = 0       ; 1 = darker inside buildings too

; Lighthouses at night: a beacon in the lamp room and two beams turning round, for every building whose file
; name holds LIGHTHOUSE. The game's own lighthouse light does not work with HD models.
[lighthouse]
enabled      = 1       ; 0 = none (Lighthouses)
beacon       = 2       ; 0..3: how bright the beacon is
beam         = 0.12    ; 0..1: how bright the beams are (Lighthouse Beam)
hideGameLight = 1      ; 1 = leave out the game's own lighthouse light (ours takes its place)
beaconSize   = 2.5     ; yards: the beacon's radius (never less than about a fifth of a degree on screen)
beamWidth    = 0.5     ; yards: the beam's half width at the lamp
beamSpread   = 0.035   ; yards it widens a yard out: 0.035 is about 2 degrees each side
beamLength   = 400     ; yards each beam reaches
beamSpeed    = 12      ; seconds the beams take to go round
beamTilt     = -0.03   ; the beam's slope: below 0 it points a little down
beamCount    = 1       ; 1 beam, or 2 opposite
surface      = 1.5     ; 0..10: its light on the surfaces round it (the tower, the rocks), times beacon
surfaceReach = 25      ; yards that light reaches
glint        = 2       ; 0..3: its glitter on the water, times beacon (Lighthouse Glint)
faceStrength = 1.6     ; 0..4: the wave faces the beam lights on the water (Wave Face Strength)
faceTilt     = 0.05    ; 0..0.3: the tilt toward the lighthouse a wave face starts to catch it (Wave Face Tilt)
faceSoft     = 0.08    ; 0.005..0.3: how gradual the edge between lit and dark faces is (Wave Face Softness)
waterWidth   = 1.5     ; 0.25..4: the patch of water the beam lights, times the beam's width (Beam Width on Water)
lampShiftX   = 2.38    ; yards across from that origin, x and y (the owner's, in Stormwind's harbour)
lampShiftY   = 0.97
lampRise     = 20      ; yards over the game's own light's origin (LIGHTHOUSEEFFECT) the lamp is
day          = 1       ; 0..1: its strength by day, as a share of the night's (0: at night only)
lampDrop     = 9       ; yards under the tower's tip the lamp is, where the tower is one group (Stormwind's harbour)
color        = 0xFFE2A8 ; RGB of the light

; Colour saturation of the world, one value by day and one at night. The change between the two follows
; the game clock by [night] dusk, dawn and fade. The UI keeps its colour. With both at 100 nothing is drawn.
[colour]
enabled      = 1       ; 0 = off: no pass and no clock read (Color Effects)
day          = 100     ; 0..200: the saturation by day, in %. 100 = the game's own, 0 = grey (Day Saturation)
night        = 100     ; 0..200: the saturation at full night (Night Saturation)

; The benchmark. Alt+F12 runs four steps: rays + volumetric light + fog, rays + the fog alone, rays, nothing. Each
; step runs for settle seconds, then is measured for measure seconds. Then the settings go back as they
; were, and a table goes to comfyfog.log: frame rate, the slowest 1% of frames, and the GPU and CPU time
; of our own passes, with the light split into its parts. Play with the light on for a minute first, so
; its cache is full. Stand still, do not move the mouse, and face the sun. F11 stops it.
[bench]
settle       = 5       ; seconds before each step is measured (shaders compile, the shadow cache fills)
measure      = 5       ; seconds each step is measured

[sky]
clouds       = 0       ; 0 = do not draw the cloud layer (live with F11)

; Foam where the water is shallow: at the shore, and round anything that stands in the water.
[water]
enabled      = 1
foam         = 0.35    ; 0..1: how white the foam is (Foam)
foamWidth    = 1       ; yards of depth: the foam thins out to nothing at this depth
edgeLine     = 0.1     ; 0..1: the thin light line where the water meets the sand (Edge Line)
edgeWidth    = 0.1     ; yards along the ground the edge line spans (Edge Line Width)
shoreFoam    = 0.85    ; 0..1: the game's own foam texture near the shore (WATERFOAMLOOP2.blp)
shoreFoamSize = 5      ; yards one copy of that texture spans
foamReach    = 4       ; yards out from the waterline: the same across the water, for a gentle beach
foamScale    = 0.6     ; yards: the size of a bubble in the foam
foamSpeed    = 1       ; how fast the foam moves and the bands roll in to the shore
ripples      = 0.4     ; 0..1: the rings round anyone standing in the water
rippleDepth  = 1       ; 0..4: how deep the rings' waves look round anyone standing still, their foam line
                       ; left as it is (Standing Ripple Depth)
rippleDepthMoving = 3.4 ; 0..4: the same for the rings of anyone walking or swimming (Moving Ripple Depth)
rippleSpread = 0.5     ; 0.1..3: how fast the rings round anyone standing still grow, so how large they get; 1 is
                       ; 1.1 yards a second (Standing Ripple Spread)
rippleSpreadMoving = 1 ; 0.1..3: the same for the rings of anyone walking or swimming (Moving Ripple Spread)
wetSand      = 0.45    ; 0..1: how much darker the sand is where the water reaches
surface      = 1       ; 0..1: how much of our water is drawn over the game's (0 = the game's water alone)
clarity      = 1       ; how clear the water is: 2 = you see twice as deep
colour       = 25      ; 0..100: the colour deep water turns: 0 green, 50 teal, 100 blue (Water Colour)
reflection   = 0.15    ; 0..1: how much of the sky the water shows at a glancing look (Sky Reflection)
skyColor     = 0x5A9AD8 ; RGB of the sky high up as the water reflects it; the horizon is the game's fog colour
brightness   = 0.7     ; 0.25..2: the water's own colour, lighter or darker (Water Brightness)
glint        = 1       ; 0..3: the sun's glint on the waves (Sun Glint)
moonGlint    = 0.6     ; 0..3: the moons' glint on the waves by night (Moon Glint)
glintSize    = 1       ; 0.25..4: how wide the glint spreads: 2 = twice as wide (Glint Size)
waves        = 1       ; 0..3: how choppy the small waves are
waveHeight   = 1       ; yards: how tall the swell rises, out where the water is 6.5 yards deep or more
waveScale    = 2       ; the size of the waves: 2 = twice as long
whitecaps    = 0.3     ; 0..1: foam on the waves out in deep water (Open Water Foam Amount)
; The drawn foam (2026-10-05): shapes made by the shader, in the style of Breath of the Wild, in place of the
; game's waterfall texture (shoreFoam, shoreFoamSize).
foamDrawn    = 1       ; 1 = the drawn foam; 0 = the game's texture (Drawn Foam)
foamCell     = 0.9     ; yards: the size of its blobs (Foam Size)
foamLife     = 3       ; yards out from the water's moving edge the foam lasts (Foam Reach)
wakeFoam     = 0.5     ; 0..1: the drawn foam's splash at a body moving through the water (Wake Foam)
shipWake     = 0       ; 0 off, 2..20: a ship's wake, a body's this many times the size (Ship Wake); 10 is a good size
shipWakeForward = 15   ; 0..60 yards: how far ahead of the hull's origin the wake starts (Ship Wake Forward)
shipWakeDepth = 2      ; 0..6: the ship's wake's waves, times a body's (Ship Wake Depth)
lakeSwash    = 0       ; 0..1: the share of the sea's swash and shore waves a lake, a pond or a river gets (the
                       ; map tells the sea from the rest) (Lake Swash)
lakeFoam     = 0.3     ; 0..1: the share of the sea's shore foam it gets (Lake Foam)
lakeWaves    = 0       ; 0..1: the share of the sea's swell (waveHeight) it gets (Lake Waves)
rain         = 1       ; 0..2: the rain's rings on the water while the game rains (Rain on Water); 0 none
objectFoam   = 0.6     ; 0..1: the drawn foam round objects standing in the water: posts, rocks, piers (Object Foam)
objectFoamWidth = 0.8  ; yards out from an object the foam reaches (Object Foam Width)
foamEdge     = 0.6     ; 0..0.9: the foam's cut at the water's edge: higher leaves more holes in the youngest foam
openFoam     = 1       ; 1 = foam on the swell's crests out in deep water, at whitecaps (Open Water Foam)
swash        = 0.6     ; above 0: the water runs up the beach and back (Swash, on or off)
swashHeight  = 0.05    ; yards of height the swash climbs at most; up a gentle beach 5 times that along the ground (Swash Height)
swashLength  = 90      ; yards along the shore one surge spans: lower, more and shorter surges (Swash Length)
swashSpeed   = 0.3     ; how fast the surges come: 1 is one every 11.4 seconds (Swash Speed)
wake         = 0.85    ; 0..1: the wake behind anyone moving through the water (Wake)
cover        = 0.5     ; 0..1: how much the water covers a character standing in it (Underwater Cover)
refraction   = 0.125   ; yards: how far the waves bend what lies under the water (Underwater Distortion)
gameWake     = 0       ; 1 = the game's own wake and splash round anyone in the water; 0 = hidden, the ripples
                       ; take their place
foamColor    = 0xEEF4F6 ; RGB of the foam by day; the night darkens it
fadeEnd      = 150     ; yards: the foam fades out over the last 40% of this distance
debug        = 0       ; 1 = the depth under the water (blue shallow, red at 4 x foamWidth); 2 = the foam alone; 3 = the wet sand alone;
                       ; 4 = what lies under it; 5 = the ripples and the wake (Debug View 16 to 20)

[general]
enabled      = 1       ; 0 = every effect off at once, the game as stock (the Atmosphere Effects box)
trace        = 0       ; 1 = F12 also traces 180 frames of the volumetric light (slow: reads the GPU), and the
                       ; log gets frame rate and light statistics every 300 frames
log         = 1
hook        = 1        ; 0 = load but patch nothing, for bisecting problems
sliders     = 1        ; 0 = do not register the CVars that the addon's controls set
reloadKey   = 122      ; VK_F11 (comfygrass has F10)
probeKey    = 123      ; VK_F12; with Alt, the benchmark
chainWaitMs = 10000    ; wait this long for comfygrass to patch first, so grass follows the new fog
minWorldDraws = 16     ; world draws needed before the switch to 2D counts as the end of the world
