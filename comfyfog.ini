; comfyfog -- thicker, moodier fog for the 1.12 client.
;
; Lives in the client root next to d3d9.dll. F11 reloads this file (every value is live);
; Shift+F11 toggles the fog for a before/after look, Ctrl+F11 the rays, Alt+F11 the beams.
; F12 logs one frame of fog state and vertex
; shader constants to comfyfog.log. Ctrl+F12 starts a read-only search for where the game keeps its
; clock; it logs what it finds over about six minutes.

[fog]
enabled    = 1

; The dial. 0 = the client's own fog, untouched. 100 = as heavy as the numbers below allow.
thickness  = 60

; What 100 looks like. Everything here is scaled by the dial, so these rarely need touching.
haze       = 0.35      ; 0..0.9, fog already there at the camera (the stock client has none up close)
reach      = 0.60      ; where fog goes solid, as a fraction of the client's own distance. Higher = gentler
                       ; climb outwards; above 1.0 pushes the wall further out than stock
desaturate = 0.35      ; 0..1, pull the fog colour toward grey
darken     = 0.20      ; 0..1, pull it toward black
tint       = 0x5A6470  ; RGB to pull toward by tintAmount (default: a cool slate)
tintAmount = 0.0       ; 0..1

shaderReg  = 30        ; shader constant the client's tree/character shaders fog from; -1 = leave them stock

; Sun shafts. Drawn after the world and before the UI, so the UI gets none. Ctrl+F11 toggles the rays;
; F11 reloads everything here.
[rays]
enabled     = 1

; The dial. 0 = no rays, 100 = maxExposure.
strength    = 35
maxExposure = 2.0

relThreshold = 0.75    ; 0..1, a pixel casts rays if it is this bright relative to the brightest thing on
                       ; screen -- so sky gaps in a dim forest still cast. Lower = more things glow
threshold   = 0.20     ; 0..1, absolute minimum brightness, so dark scenes do not streak from dim lights
radius      = 0.8      ; how far from the sun, in screen heights, pixels still cast rays.
                       ; Keep this tight: wider lets bright clouds elsewhere in the sky cast rays too
falloff     = 2.0      ; how sharply that fades with distance: 1 = straight line, 2+ = hugs the sun
length      = 0.85     ; 0..1, ray length as a fraction of the way from each pixel toward the sun
maxLength   = 0.6      ; ...but never longer than this many screen heights (matters when the sun is far off screen)
maxAngle    = 140      ; degrees between where you look and the sun at which rays are gone. Over 90 means
                       ; rays still stream in from above/behind with the sun out of view (the canopy look)
viewFalloff = 1.0      ; how quickly rays weaken as you turn from the sun toward maxAngle; higher = faster
parallel    = 0.0      ; 0 = rays fan out from the sun (how real sunbeams look in perspective);
                       ; 1 = parallel streaks all falling the same way -- a stylised look, not steadier
adaptTime   = 0.5      ; seconds for "what counts as bright" to follow the scene; 0 = instant (flickers)
decay       = 0.96     ; 0.5..1, falloff along each ray; lower = shorter, softer shafts
color       = 0xFFE6BE ; RGB of the light (default: warm late-morning)
passes      = 3        ; 1..3 blur passes; fewer is cheaper but shows banding
downscale   = 2        ; work at 1/N resolution per axis

; Where the sun is.
;   sunMode 0 = pinned to the screen at (sunX, sunY); 0,0 is top-left, 1,1 bottom-right. The default is
;               "12 o'clock": top centre, well above the edge. The further above (more negative sunY),
;               the more parallel the rays and the wider they spread; near 0 they fan from a point.
;   sunMode 1 = a fixed sun for both the rays and the beams (azimuth/elevation below, in degrees),
;               whatever time the game says it is -- for testing in the same light every time. The
;               defaults are the afternoon sun the sky showed while this was being tuned.
;   sunMode 2 = the sun the client draws in the sky, so rays come from the visible sun and follow the
;               time of day. The sun need not be on screen: rays stream in from its side (see maxAngle).
sunMode     = 2
sunX        = 0.5
sunY        = -0.30
azimuth     = 45
elevation   = 50

debugView   = 0        ; 1 = show only the bright-pixel mask, 2 = show only the rays (for tuning)

placement     = 0      ; 0 = between world and UI; 1 = over everything, UI included (fallback)
minWorldDraws = 16     ; world draws needed before the switch to 2D counts as "the UI starts here"

; Light shafts that live in the world: soft beams around your character, angled along the sun, hidden
; behind trees and hills. They stay put as you move the camera -- unlike the rays above, which are
; rebuilt from the screen image. Colour comes from [rays] color. Alt+F11 toggles them.
[beams]
enabled      = 1

; The dial. 0 = none, 100 = maxIntensity.
strength     = 50
maxIntensity = 0.6

spacing      = 7.0     ; yards between possible shafts (at most one per grid cell)
density      = 0.35    ; 0..1, how many of those cells actually hold a shaft
radius       = 35      ; shafts appear within this many yards of you
height       = 28      ; how high each shaft rises toward the sun, yards
baseOffset   = -3      ; where shafts start relative to your feet, yards (below, so hills do not float them)
widthMin     = 0.5     ; shaft width range, yards (most are thin, a few broad)
widthMax     = 3.5
heightVar    = 0.4     ; 0..1, how much shaft heights vary around `height`
clusterChance = 0.3    ; 0..1, how many shafts come with two thin companions (light through a ragged gap)
forwardPower = 3.0     ; how much brighter shafts are when you look toward the sun (higher = tighter)
backLight    = 0.25    ; 0..1, how visible they stay with the sun behind you
nearFade     = 3.0     ; yards: shafts this close to the camera fade out, so one passing through you does not smear
shimmer      = 0.25    ; 0..1, slow breathing of each shaft
maxBeams     = 96
indoorHold   = 1.5     ; seconds without the sky's sun before shafts fade out as "indoors"

; Shafts need leaves to cast them. "Canopy" measures how much of the top of the view is dark cover with
; bright gaps (0 = open sky, 1 = dense forest). Shafts begin at canopyStart and are full by canopyFull.
; F12 logs the current value, handy for setting these.
canopyStart  = 0.35
canopyFull   = 0.6
canopyTime   = 2.0     ; seconds for that to follow you (slow, so looking around does not flicker it)

; Where the client keeps the camera and the player (same addresses comfygrass uses).
camAddr      = 0x00C7CF20
objMgrAddr   = 0x00B41414
playerPosOff = 0x9B8

[sky]
clouds       = 1       ; 0 = do not draw the cloud layer (live with F11)

; The game's time of day, on your screen only. Writes into the client's memory, so it is off by default.
; Ctrl+PageUp / Ctrl+PageDown move it an hour while it is on. The addresses were found for this WoW.exe by
; the Ctrl+F12 search; a different WoW.exe needs that search re-run, and the DLL refuses to write if they
; do not hold a time.
[time]
enabled      = 0
hour         = 13      ; 0..24, fractions allowed (13.5 = 13:30)
addrMinutes  = 0x00CE9B60
addrFraction = 0x00CE9B64
addrMinutesF = 0x00CE8574

[general]
log         = 1
hook        = 1        ; 0 = load but patch nothing, for bisecting problems
reloadKey   = 122      ; VK_F11 (comfygrass has F10)
probeKey    = 123      ; VK_F12
chainWaitMs = 10000    ; wait this long for comfygrass to patch first, so grass follows the new fog
