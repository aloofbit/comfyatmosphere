; comfyfog: thicker, moodier fog and volumetric light for the 1.12 client.
;
; Lives in the client root next to d3d9.dll. F11 reloads this file (every value is live);
; Shift+F11 toggles the fog for a before/after look, Alt+F11 the volumetric light.
; F12 logs one frame of fog state and vertex
; shader constants to comfyfog.log. (Setting the time of day is comfytime, a separate DLL.)
;
; The ComfyAtmosphere addon puts five of these settings in Video > Shaders: [fog] enabled and thickness,
; [volume] enabled and strength, and [sky] clouds. The values here are the defaults of those controls.
; A control you move wins over this file, also after F11. The Defaults button in that page puts the
; values here back.

[fog]
enabled    = 1

; The dial. 0 = the client's own fog, untouched. 100 = as heavy as the numbers below allow.
thickness  = 60

; What 100 looks like. Everything here is scaled by the dial, so these rarely need touching.
haze       = 0.35      ; 0..0.9, fog already there at the camera (the stock client has none up close)
reach      = 0.60      ; where fog goes solid, as a fraction of the client's own distance. Higher = gentler
                       ; climb outwards; above 1.0 pushes the wall further out than stock
desaturate = 0.35      ; 0..1, pull the fog colour toward grey
darken     = 0.20      ; 0..1, pull it toward black
tint       = 0x5A6470  ; RGB to pull toward by tintAmount (default: a cool slate)
tintAmount = 0.0       ; 0..1

shaderReg  = 30        ; shader constant the client's tree/character shaders fog from; -1 = leave them stock

; Where the sun is, for the shadow map and the volumetric light. By default it is the sun the client
; draws in the sky, so the light follows the time of day.
[sun]
fixed        = 0       ; 1 = a fixed sun at azimuth/elevation below, whatever time the game says it is,
                       ; for testing in the same light every time
azimuth      = 45      ; degrees; the defaults are the afternoon sun the sky showed while this was tuned
elevation    = 50

; Where the client keeps the camera and the player (the same addresses comfygrass uses). Shadows and
; volumetric light read them. Another WoW.exe build moves them.
[client]
camAddr      = 0x00C7CF20
objMgrAddr   = 0x00B41414
playerPosOff = 0x9B8

; A depth buffer the shaders can read (the INTZ format) swapped in for the client's. The volumetric light
; reads it. Off by default.
[depth]
enabled      = 0

; A shadow map from the sun: the frame's solid world (terrain, buildings, trees) drawn a second time as the
; sun sees it. The volumetric light reads it. Off by default.
[shadow]
enabled      = 0
size         = 4096    ; texels per side
range        = 250     ; yards covered either side of you
depth        = 700     ; yards toward and away from the sun (far enough for a ridge to block it)
mapEvery     = 2       ; rebuild the shadow map every N frames (2 halves the cost of the replay)
horizon      = 1       ; 1 = distant terrain shades you too
snap         = 0       ; 1 = hold the map on whole texels: steadier standing still, steps as you walk
cacheTime    = 15      ; seconds a tree or building out of view keeps casting shade
evictDistance = 20     ; yards: something in view this near that the game stopped drawing is gone

; Volumetric light: the fog glowing where the sun reaches it and dark where leaves and walls shade it.
; The lamp-in-a-foggy-room look, fixed in the world as you move the camera. Needs [depth] and [shadow]
; enabled. Alt+F11 toggles it.
[volume]
enabled      = 0
strength     = 30      ; the dial, 0..100
maxIntensity = 3.0     ; brightness at 100
density      = 0.009   ; how much the air scatters light, per yard. Higher = thicker, brighter shafts
smooth       = 0.6     ; 0..0.95: how much of the last frame's glow is kept (eased off as you turn)
steps        = 96      ; samples along each line of sight (more holds up over a long maxDistance)
maxDistance  = 250     ; yards along each line of sight (keep at or under [shadow] range)
anisotropy   = 0.15    ; 0 = glows the same from every side; toward 1 = mostly when looking toward the sun
bias         = 0.5     ; yards of slack in the shadow test, against speckle on sunlit surfaces
color        = 0xFFE6BE ; RGB of the light (default: warm late-morning)
downscale    = 2       ; work at 1/N resolution per axis (2 = half)
blur         = 1       ; smooth the noise the step jitter leaves
debug        = 0       ; 1 = show the glow alone, white, to see its shape. For finding faults, one stage
                       ; of the march each: 2 = white if it runs at all, 3 = the depth it reads,
                       ; 4 = distance marched (white = maxDistance), 5 = share of each ray in sunlight

[sky]
clouds       = 1       ; 0 = do not draw the cloud layer (live with F11)

[general]
trace        = 0       ; 1 = F12 also traces 180 frames of the volumetric light (slow: reads the GPU)
log         = 1
hook        = 1        ; 0 = load but patch nothing, for bisecting problems
sliders     = 1        ; 0 = do not register the CVars that the addon's controls set
reloadKey   = 122      ; VK_F11 (comfygrass has F10)
probeKey    = 123      ; VK_F12
chainWaitMs = 10000    ; wait this long for comfygrass to patch first, so grass follows the new fog
minWorldDraws = 16     ; world draws needed before the switch to 2D counts as the end of the world
