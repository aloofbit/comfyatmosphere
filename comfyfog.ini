; comfyfog: thicker, moodier fog, sun rays and volumetric light for the 1.12 client.
;
; Lives in the client root next to d3d9.dll. F11 reloads this file (every value is live);
; Shift+F11 toggles the fog for a before/after look, Ctrl+F11 the sun rays, Alt+F11 the volumetric light.
; F12 logs one frame of fog state and vertex shader constants to comfyfog.log, and over the next 60
; frames the lights of lamps, lanterns and torches (lines starting "lamps:"). Alt+F12 runs the benchmark
; (see [bench]). (Setting the time of day is comfytime, a separate DLL.)
;
; The ComfyAtmosphere addon puts twenty-two of these settings in Video > Atmosphere: [general] enabled (the
; box at the top, every effect at once), [fog] enabled, thickness, density,
; height, cover, darken and desaturate, [volume] enabled, strength and quality, [sunshadows] enabled, strength and softness, [shadow]
; size and mapEvery, [rays] enabled, strength, soften and smooth, [night] strength and [sky] clouds. The
; values here are the defaults of those controls. Its Debug View slider shows one stage of an effect (the
; list is in its tooltip); at 0 the debug values in this file apply. /atmos in the game's chat sets any
; other value here (see the README).
; A control you move wins over this file, also after F11. The Defaults button in that page puts the
; values here back.

[fog]
enabled    = 1

; The dial. 0 = the client's own fog distance, untouched. 100 = as heavy as the numbers below allow.
thickness  = 10

; Our own fog: thick low down and thinning upward, drawn over the picture while Volumetric Light is on.
; The game's fog is moved out of the way meanwhile. With mode 0, or the light off, the game's fog is used,
; moved by haze and reach below.
mode       = 1         ; 1 = our own fog, 0 = the game's fog
density    = 0.001     ; the ground haze: fog per yard at your height, 0..0.02 (the Ground Haze control,
                       ; 25 = 0.005). Not scaled by the thickness, which moves the distance fog
height     = 130       ; yards: the fog thins by 2.7 times every this many yards up
distance   = 1         ; 0..1, how much of the game's own distance fog is kept (on a soft curve): far
                       ; mountains go to the fog colour in one flat layer
cover      = 0.65      ; past this share of the view distance, things fade fully into the fog by the
                       ; view distance
skyDepth   = 0.99999   ; depth at or past which a pixel is the sky itself. Between the world and this is
                       ; scenery drawn with the sky, far mountains, which get full fog as in the game
debug      = 0         ; 1 = show our fog's amount alone (white = all fog); 2 = that far scenery in red

; The game's fog (mode 0). haze and reach are scaled by the dial, so these rarely need touching.
haze       = 0.35      ; 0..0.9, fog already there at the camera (the stock client has none up close)
reach      = 0.60      ; where fog goes solid, as a fraction of the client's own distance. Higher = gentler
                       ; climb outwards; above 1.0 pushes the wall further out than stock
; The game's fog colour. Applied as set, also with Atmospheric Fog off: not scaled by the dial.
desaturate = 0.8       ; 0..1, pull the fog colour toward grey
darken     = 0.75      ; 0..1, pull it toward black
tint       = 0x5A6470  ; RGB to pull toward by tintAmount (default: a cool slate)
tintAmount = 0.0       ; 0..1
skyMatch   = 1.0       ; 0..1, how far the sky near the horizon fades into the fog colour when the colour
                       ; is changed, so fogged trees and ground meet a sky of the same colour. Needs
                       ; Volumetric Light on (the depth)
skyBand    = 0.35      ; how high above the horizon the sky change fades out (0.35 is about 20 degrees)
skyDebug   = 0         ; 1 = the sky it changes shows red

shaderReg  = 30        ; shader constant the client's tree/character shaders fog from; -1 = leave them stock

; Where the sun is, for the shadow map and the volumetric light. By default it is the sun the client
; draws in the sky, so the light follows the time of day.
[sun]
fixed        = 0       ; 1 = a fixed sun at azimuth/elevation below, whatever time the game says it is,
                       ; for testing in the same light every time
azimuth      = 45      ; degrees; the defaults are the afternoon sun the sky showed while this was tuned
elevation    = 50

; Where the client keeps the camera and the player (the same addresses comfygrass uses). Shadows and
; volumetric light read them. Another WoW.exe build moves them.
[client]
camAddr      = 0x00C7CF20
objMgrAddr   = 0x00B41414
playerPosOff = 0x9B8
clockAddr    = 0x00CE9B64 ; the game's time of day, for [night] (the address comfytime writes)
mapNameAddr  = 0x00C961A0 ; the current map's folder name, for [shadow] mapTerrain

; A depth buffer the shaders can read (the INTZ format) swapped in for the client's. The volumetric light
; reads it. Off by default.
[depth]
enabled      = 1

; A shadow map from the sun: the frame's solid world (terrain, buildings, trees) drawn a second time as the
; sun sees it. The volumetric light reads it. Off by default.
[shadow]
enabled      = 1
size         = 4096    ; texels per side, 256..4096. 4096 gives sharper sun shadows and costs about twice the
                       ; GPU time of 2048. The Shadow Resolution control sets 1024, 2048 or 4096
range        = 250     ; yards covered either side of you
nearRange    = 64      ; a finer map this many yards either side of you, for the sun shadows. 0 = none
depth        = 700     ; yards toward and away from the sun (far enough for a ridge to block it)
nearMargin   = 16      ; yards past the near map a model's reference point may be and still be drawn into it
terrainLeaves = 1      ; 1 = hills and mountains cast part shade, as leaves do; 0 = full shade
mapTerrain   = 1       ; 1 = the ground is read from the map files at full detail; 0 = only what the game draws
leafAlpha    = 224     ; the leaves from the map files cast where their texture's alpha is at least this (1..255)
leaves       = 1       ; 1 = leaves and bushes (alpha-tested) in shadow maps of their own, so they can let
                       ; part of the sun through ([sunshadows] leafShade)
minTriangles = 200     ; models with fewer triangles stay out of the far map past 60 yards (0 = all in)
farEvery     = 2       ; of those rebuilds, redraw the far map on every Nth (the near map on each), 1..8
mapEvery     = 1       ; rebuild the shadow map every N frames, 1..8 (3 = a third of the replay cost).
                       ; The Shadow Redraw control sets it
horizon      = 1       ; 1 = distant terrain shades you too
snap         = 0       ; 1 = hold the map on whole texels: steadier standing still, steps as you walk
keepMargin   = 100     ; yards past range that a tree or building out of view keeps casting shade, from you
                       ; across the ground: while it can still cast into the map
cacheTime    = 0       ; seconds at most that something out of view keeps casting shade; 0 = no limit
staleTime    = 20      ; with mapTerrain: seconds at most that something the game stopped drawing keeps its
                       ; shade (characters, creatures, objects); 0 = no limit
evictDistance = 20     ; yards: something in view this near that the game stopped drawing is gone
stillRadius  = 0.3     ; yards a tree may seem to move and keep its place in the map

; Volumetric light: the fog glowing where the sun reaches it and dark where leaves and walls shade it.
; The lamp-in-a-foggy-room look, fixed in the world as you move the camera. Needs [depth] and [shadow]
; enabled. Alt+F11 toggles it.
[volume]
enabled      = 1
strength     = 20      ; the dial, 0..100
maxIntensity = 3.0     ; brightness at 100
density      = 0.015   ; how much the air scatters light, per yard. Higher = thicker, brighter shafts
smooth       = 0.85    ; 0..0.95: how much of the last frame's glow is kept. It moves with the camera, so a
                       ; turn does not smear. 0 also stops the noise pattern from changing each frame
steps        = 64      ; samples along each line of sight (more holds up over a long maxDistance)
maxDistance  = 250     ; yards along each line of sight (keep at or under [shadow] range)
anisotropy   = 0.025   ; 0 = glows the same from every side; toward 1 = mostly when looking toward the sun
bias         = 0.5     ; yards of slack in the shadow test, against speckle on sunlit surfaces
leafShade    = 1       ; how much of the sun the leaves stop in the air, 0..1. 1 = the light comes through the
                       ; gaps between the leaves only, in shafts. The ground's own is [sunshadows] leafShade
color        = 0xFFE6BE ; RGB of the light (default: warm late-morning)
downscale    = 2       ; work at 1/N resolution per axis (2 = half)
blur         = 1       ; smooth the noise the step jitter leaves
quality      = 3       ; 1 low, 2 medium, 3 high. High uses the values above; medium and low replace
                       ; steps and downscale with cheaper ones: medium 48, 2; low 32, 3
debug        = 0       ; 1 = show the glow alone, white, to see its shape. For finding faults, one stage
                       ; of the march each: 2 = white if it runs at all, 3 = the depth it reads,
                       ; 4 = distance marched (white = maxDistance), 5 = share of each ray in sunlight
occlusion    = 1       ; 1 = the light fades when the sun's disc is behind terrain on screen, as for the
                       ; rays ([rays] occlusionRadius and occlusionFull). The shadow map reaches only
                       ; [shadow] depth, so without this a sun setting behind the far horizon lights the fog

; Sun shadows: trees, buildings and characters shade the ground and walls. They come from the volumetric
; light's shadow map, so they draw only while [volume] draws. They follow the sun's height and [night]
; strength. Within [shadow] nearRange yards of you they use a finer map (0.03 yards a texel), further out
; the far one (0.24). F12 logs the draw (lines starting "sunshadows:").
[sunshadows]
enabled      = 1
world        = 1       ; terrain, buildings, trees and doodads cast. 0 = only players and creatures do,
                       ; and the ground keeps the game's own baked shadows
units        = 1       ; players and creatures cast. 0 = the game's round shadow under them instead
lock         = 0       ; 1 = shadows at a set tilt all day, as the game's own baked shadows are; 0 = follow the sun
lockTilt     = 15      ; with lock: degrees from straight down (0 = the sun overhead, short shadows)
lodBias      = 2       ; yards of slack in the shadow test for every 100 yards past lodStart: the game draws
                       ; distant ground coarser, and without it soft blobs lie on far slopes. 0 = none
lodStart     = 80      ; yards from the camera where lodBias starts
strength     = 35      ; the dial, 0..100: how much of the light a shaded surface loses
bias         = 3       ; texels of slack in the depth test at the least; more as the sun gets lower, so flat
                       ; ground does not shade itself in stripes. In texels of each map. Higher = no bands where
                       ; a surface shades itself, but shadows start further from what casts them
minGap       = 0       ; yards: a blocker nearer the surface than this, along the sun, does not shade it.
                       ; Against a model or a tree shading itself; shadows then start this far from
                       ; where something touches the ground
sunOffset    = 0.06    ; yards each point is moved toward the sun before the test, against the same
normalBias   = 0       ; texels each point is moved along its facing, rebuilt from the depth. That facing
                       ; is per triangle on a model, so above 0 the triangles show on characters
slope        = 0       ; 0..1, how much of the surface's slope (from the same facing) sets each tap's depth.
                       ; Try 1 if sloped ground shows stripes at a high softness
softness     = 1.0     ; how far apart the taps of the soft edge are, in map texels. 0 = sharp edges
baked        = 0       ; 0..1, how much of the terrain's own baked shadow is kept while these draw. It
                       ; points one way at every hour; it is back in full as these fade at dusk
leafShade    = 0.6     ; 0..1, the share of the sun that leaves stop. Solid things under them still shade
sunlight     = 0.2     ; 0..0.5, what the sun reaches is brightened by up to this share (0.2 = 20%)
debug        = 0       ; 1 = show the shade alone (white = lit); 2 = the leaves' shade alone

; Lamps, lanterns and torches: the fog glows around them, and lampposts light the ground and walls near
; them as the game's torches do. The lights are the game's own (torches and braziers, also those NPCs
; carry) and lampposts, found by their glow sprite. It uses the volumetric light's depth and camera, so it
; draws only while [volume] draws, but it does not follow the sun and draws at night too.
; F12 logs the lights it draws (lines starting "lampglow:").
[lamps]
enabled      = 1
strength     = 40      ; the dial, 0..100
maxIntensity = 10.0    ; the glow in the air: brightness at 100
surface      = 7       ; a lamppost's light on the ground and walls near it, like a torch's: brightness
                       ; at 100. 0 = none. The game's own torches light these already and are left alone
density      = 0.03    ; how much the air scatters a lamp's light, per yard. Higher = a wider, brighter glow
day          = 30      ; % of the night strength by day, by [night] dusk, dawn and fade
maxDistance  = 120     ; yards: a light further away adds nothing. The glow also fades over the far half
                       ; of the fog
maxLights    = 16      ; the nearest this many are drawn, 1..16
keep         = 2       ; seconds a light on screen may go unseen before it fades out. A light off screen
                       ; is kept: the game names a lamppost only while it is on screen
softness     = 0.4     ; yards: the radius of a light's bright core
through      = 1.5     ; yards the glow runs on past the first surface in the way. The game's light sits
                       ; inside the torch head or the bowl, which hides it from some angles at 0. A lamp
                       ; this near behind a wall glows faintly through it
sprites      = 1       ; 1 = lampposts glow too, found by their warm glow sprite
spriteReach  = 16      ; yards a lamppost's light reaches (a torch's is 17; the game's lights carry their own)
spriteGain   = 1.5     ; a lamppost's brightness; 1.5 is about a torch's
debug        = 0       ; 1 = show the glow alone, over black; 2 = the distance it reads (white = 50 yd);
                       ; 3 = the light on surfaces alone

; Sun rays: bright sky near the sun streaks outward, through gaps in the trees and clouds. Drawn after the
; world and before the UI, so the UI gets none. Cheap, and needs neither [depth] nor [shadow]. The rays
; follow the sun in [sun]. Ctrl+F11 toggles them.
[rays]
enabled      = 1

; The dial. 0 = no rays, 100 = maxExposure, on a curve: exposure = maxExposure x (strength / 100)^2.
; Most of the change is at the top of the dial. 35 gives 0.7.
strength     = 30
maxExposure  = 5.7

relThreshold = 0.20    ; 0..1, a pixel casts rays if it is this bright relative to the brightest thing on
                       ; screen, so sky gaps in a dim forest still cast. Lower = more things glow
threshold    = 0.20    ; 0..1, absolute minimum brightness, so dark scenes do not streak from dim lights
radius       = 0.8     ; how far from the sun, in screen heights, pixels still cast rays.
                       ; Keep this tight: wider lets bright clouds elsewhere in the sky cast rays too
falloff      = 2.0     ; how sharply that fades with distance: 1 = straight line, 2+ = hugs the sun
length       = 0.85    ; 0..1, ray length as a fraction of the way from each pixel toward the sun
maxLength    = 0.6     ; ...but never longer than this many screen heights (matters when the sun is far off screen)
maxAngle     = 60      ; degrees between where you look and the sun at which rays are gone. Over 90, rays
                       ; stream in from the top of the screen with the sun out of view, fed by whatever sky is
                       ; there, so the view brightened and darkened as the camera tilted. The shafts from a sun
                       ; out of view come from the volumetric light instead
viewFalloff  = 1.0     ; how quickly rays weaken as you turn from the sun toward maxAngle; higher = faster
parallel     = 0.0     ; 0 = rays fan out from the sun (how real sunbeams look in perspective);
                       ; 1 = parallel streaks all falling the same way: a stylised look, not steadier
adaptTime    = 0.5     ; seconds for "what counts as bright" to follow the scene; 0 = instant (flickers)
decay        = 0.96    ; 0.5..1, falloff along each ray; lower = shorter, softer shafts
soften       = 8       ; pixels (of the mask, which is 1/downscale of the screen) the mask is blurred before
                       ; the rays are drawn, so small gaps between leaves do not make rays jump. 0 = none
smooth       = 0.4     ; 0..0.95, how much of the last frame is kept, moved with the sun. Leaf edges
                       ; smaller than a pixel flicker as the camera moves; this keeps the rays steady. 0 = none
color        = 0xFFE6BE ; RGB of the light (default: warm late-morning)
passes       = 3       ; 1..3 blur passes; fewer is cheaper but shows banding
downscale    = 2       ; work at 1/N resolution per axis
debugView    = 0       ; 1 = show only the bright-pixel mask, 2 = show only the rays, 3 = show the sky
                       ; kept before the clouds (for skyOnly). For tuning
placement    = 0       ; 0 = between world and UI; 1 = over everything, UI included (fallback)
mask         = 1       ; 1 = a pixel casts where it shows sky, from the depth buffer: steady as the camera moves.
                       ; 0 = by brightness, relative to the brightest thing on screen (relThreshold)
skyOnly      = 1       ; 1 = only the sky casts, not the clouds: lit clouds near the sun glow otherwise.
                       ; The kept sky has no glow, so it is dimmer; relThreshold 0.20 suits it. 0 = all
secondMoon   = 1       ; at night the volumetric light follows the larger of the two moons. 1 = the other
                       ; moon casts rays too; 0 = rays from the larger moon only
occlusion    = 1       ; 1 = rays fade when the sun itself is covered, by a mountain or a wall. Tested by
                       ; depth when [depth] is on, else by brightness (needs skyOnly; heavy fog defeats
                       ; it). 0 = the sky above a ridge casts rays over it with the sun behind it
occlusionRadius = 0.08 ; screen heights around the sun that are tested
occlusionFull = 0.35   ; share of that sky in view that gives full rays; less fades them. Lower keeps
                       ; more rays through a canopy

; Sun rays and volumetric light at night. At night they follow the moons, which are high in the sky, so
; without this the rays and the light at night are as strong as by day. Night is
; told from the game clock ([client] clockAddr), so it follows the time comfytime sets. F12 logs the game
; time and the value in use.
[night]
strength     = 25      ; the dial, 0..100: the rays and the light at night, as % of their day strength.
                       ; 100 = as by day, 0 = none at night
dusk         = 20      ; hour the change to night starts (fractions allowed: 20.5 = 20:30)
dawn         = 5       ; hour the change to day starts
fade         = 1.5     ; hours each change takes: full night from dusk + fade to dawn, full day from
                       ; dawn + fade to dusk

; The benchmark. Alt+F12 runs four steps: fog + rays + volumetric light, fog + rays, fog, nothing. Each
; step runs for settle seconds, then is measured for measure seconds. Then the settings go back as they
; were, and a table goes to comfyfog.log: frame rate, the slowest 1% of frames, and the GPU and CPU time
; of our own passes, with the light split into its parts. Play with the light on for a minute first, so
; its cache is full. Stand still, do not move the mouse, and face the sun. F11 stops it.
[bench]
settle       = 5       ; seconds before each step is measured (shaders compile, the shadow cache fills)
measure      = 5       ; seconds each step is measured

[sky]
clouds       = 0       ; 0 = do not draw the cloud layer (live with F11)

[general]
enabled      = 1       ; 0 = every effect off at once, the game as stock (the Atmosphere Effects box)
trace        = 0       ; 1 = F12 also traces 180 frames of the volumetric light (slow: reads the GPU), and the
                       ; log gets frame rate and light statistics every 300 frames
log         = 1
hook        = 1        ; 0 = load but patch nothing, for bisecting problems
sliders     = 1        ; 0 = do not register the CVars that the addon's controls set
reloadKey   = 122      ; VK_F11 (comfygrass has F10)
probeKey    = 123      ; VK_F12; with Alt, the benchmark
chainWaitMs = 10000    ; wait this long for comfygrass to patch first, so grass follows the new fog
minWorldDraws = 16     ; world draws needed before the switch to 2D counts as the end of the world
