<svg xmlns="http://www.w3.org/2000/svg" width="360" height="160" viewBox="0 0 360 160" role="img" aria-label="Roadmap: 1 Feasibility Study, done. 2 Prototype Effects, done. 3 Tests and Repairs, now. 4 Performance, next. 5 Maintenance, later.">
<style>
  :root { --bg: #ffffff; --line: #d0d7de; --text: #1f2328; --muted: #59636e; --soft: #f6f8fa;
          --now: #0969da; --done: #1a7f37; --todo: #d0d7de; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --line: #30363d; --text: #e6edf3; --muted: #9198a1; --soft: #161b22;
            --now: #4493f8; --done: #3fb950; --todo: #3d444d; }
  }
  text { font-family: -apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: var(--text); }
  .c { text-anchor: middle; }
  .stage { font-size: 13px; }
  .bold { font-weight: 600; }
  .muted { fill: var(--muted); }
  .small { font-size: 12px; }
  .w { fill: #ffffff; }
  .done { fill: var(--done); } .now { fill: var(--now); } .todo { fill: var(--todo); }
  .tdone { fill: var(--done); } .tnow { fill: var(--now); }
  .box-todo { fill: none; stroke: var(--todo); stroke-width: 2; }
  .soft { fill: var(--soft); }
  .tick { fill: none; stroke: #ffffff; stroke-width: 2.5; stroke-linecap: square; }
</style>
<rect x="0" y="5" width="18" height="18" class="done"/><path d="M4 14 l4 4 l7 -8" class="tick"/><text x="30" y="19" class="stage" font-size="14">Feasibility Study</text><text x="200" y="19" class="small bold tdone">done</text>
<rect x="0" y="37" width="18" height="18" class="done"/><path d="M4 46 l4 4 l7 -8" class="tick"/><text x="30" y="51" class="stage" font-size="14">Prototype Effects</text><text x="200" y="51" class="small bold tdone">done</text>
<rect x="1" y="70" width="16" height="16" class="box-todo" style="stroke: var(--now)"/><rect x="5" y="74" width="8" height="8" class="now"/><text x="30" y="83" class="stage bold" font-size="14">Tests and Repairs</text><text x="200" y="83" class="small bold tnow">now</text>
<rect x="1" y="102" width="16" height="16" class="box-todo"/><text x="30" y="115" class="stage muted" font-size="14">Performance</text><text x="200" y="115" class="small bold muted">next</text>
<rect x="1" y="134" width="16" height="16" class="box-todo"/><text x="30" y="147" class="stage muted" font-size="14">Maintenance</text><text x="200" y="147" class="small bold muted">later</text>
</svg>
